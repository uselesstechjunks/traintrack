<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Viewing</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <!--script async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script-->
  <!--script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js"></script-->
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
</head>
<body>
  <nav><a href="index.html">← Index</a></nav>
  <article id="content" class="markdown-body">Loading...</article>
  <script>
    function getFile() {
      const p = new URLSearchParams(location.search);
      return p.get('file') || 'READLIST.md';
    }
    const file = getFile();
    fetch('content/' + file)
      .then(r => {
        if (!r.ok) throw new Error('Not found: ' + file);
        return r.text();
      })
      .then(md => {
        const content = document.getElementById('content');
        content.innerHTML = marked.parse(md);
        const h1 = content.querySelector('h1');
        if (h1) document.title = h1.textContent + ' — Notes';
        return MathJax.typesetPromise([content]);
      })
      .catch(err => {
        document.getElementById('content').textContent = err.message;
      });
  </script>
</body>
</html>
